<!DOCTYPE html><!-- This declares that the documents is an HTML -->
<html lang="en" dir="ltr"> <!-- This specifies that the page's language is English and you read from left to right-->

    <!--None of this will be shown on the actual web page-->
    <head>
        <meta charset="utf-8"> <!-- This is makes the page compatible with different character sets -->
        <title>Success</title> <!-- This is the title of the page -->
          <link rel="stylesheet"  href="CSS/Book_stylesheet.css" />  <!-- This links the CSS file to the HTML page -->
        <script src="JavaScript/success.js"></script> <!-- This links the JavaScript file to the page -->
        <script src="JavaScript/Navigation.js"></script> <!-- This links the JavaScript file to the page -->
        <script src="JavaScript/Font_size.js"></script>
        <script src="JavaScript/Theme.js"></script>
         <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- This changes the size of the page depending on the device -->
        </head>

        <body>

    <div class="Header_container"> <!-- This creates a container for the contact page -->
        <img id="Success_logo" class="logo" src="Images/Book_Logo/Logo.jpg" > <!-- This adds the logo next to the home page header-->
        <h1 id="Success_header" class="Main_header">Paper Book Lovers</h1> <!--This is the main header and title of the page of the page-->
    </div>

   <!--This is the navigation bar dedicated to the home page-->
    <div id="Success_nav" class="Navigation"> <!--This creates an unique id for the navigation in the home and puts the navigaton bar into a class -->

        <nav> <!--This creates navigation links-->

        <button class="Navigation_toggle" id="Success_toggle">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>

        </button>

            <ul class="Navigation_links"><!--This creates an unordered list for the navigation items -->
                <!--Everything is linked to their pages-->
                 <li id="S_nav1"><a href="Home.html">Home</a></li>
                 <li id="S_nav2"><a href="About_Us.html">About Us</a></li>
                 <li id="S_nav3"><a href="Contact_Us.html">Contact Us</a></li>
            </ul>

        <!--This creates a class for the font size buttons-->
        <div class="font-controls">

        <button id="Success_Increase_button">A+</button>

        <button id="Success_Reset_button">A</button>

        <button id="Success_Decrease_button">A-</button>

</div>

<!--This created a theme selector-->
<div class="colour_theme_container">
    <label for="S_Colour_selector">Theme:</label>
    <select id="S_Colour_selector" class="Colour_selector">
        <option value="default">Default</option>
        <option value="dark">Dark</option>
        <option value="light">Light</option>
    </select>
    </div>

    <!--This created an icon for the basket-->
    <div class="basket_container">

        <button class="baskets" id="Sucess_basket">
        <span class="basket_icon" >
        <img class="basket_icons" id="Success_basket_icon" src="Images/Icon/Basket.jpg">
        </span>
        <span class="basket_number" id="Success_basket_number">0</span>
        </button>
    </div>
        </nav>
    </div>
   

        
        <div class="message">
            <p id="success_message"></p> <!-- This is the success message that is displayed after a successful payment -->
        </div>

        </body>
</html>
