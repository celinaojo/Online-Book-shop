<!DOCTYPE html> <!-- This declares that the documents is an HTML -->
<html lang="en" dir="ltr"> <!-- This specifies that the page's language is English and you read from left to right-->
 
<!--None of this will be shown on the actual web page-->

<head> <!--This contains the meta data of the page-->
 <meta charset="UTF-8"> <!-- This specifies the character encoding for the HTML document -->
 <title>Paper Book Lovers About Us</title> <!--This makes 'PaperBook Lovers' the title of the page-->
 <link rel="stylesheet" href="CSS/Book_stylesheet.css"> <!-- This links the HTML document to the CSS document-->
 <script src="JavaScript/Payment.js"></script> <!-- This links the HTML document to the JavaScript document-->
<script src="JavaScript/Navigation.js"></script> <!-- This links the JavaScript file to the page -->
  <script src="JavaScript/Font_size.js"></script>
 <script src="JavaScript/Theme.js"></script>
 <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- This makes the page responsive to different screen sizes -->
</head>

<body><!-- Everything inside the tag '<body>' will be shown on the actual web page-->

    <div class="Header_container"> <!-- This creates a container for the contact page -->
        <img id="About_logo" class="logo" src="Images/Book_Logo/Logo.jpg" > <!-- This adds the logo next to the about page header-->
        <h1 id="About_header" class="Main_header">Paper Book Lovers</h1> <!--This is the main header and title of the page of the page-->
    </div>

  <!--This is the navigation bar dedicated to the home page-->
    <div id="About_nav" class="Navigation"> <!--This creates an unique id for the navigation in the home and puts the navigaton bar into a class -->

        <nav> <!--This creates navigation links-->

        <button class="Navigation_toggle" id="About_toggle">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        
        </button>

            <ul class="Navigation_links"><!--This creates an unordered list for the navigation items -->
                <!--Everything is linked to their pages-->
                 <li id="A_nav1"><a href="Home.html">Home</a></li>
                 <li id="A_nav2"><a href="About_Us.html">About Us</a></li>
                 <li id="A_nav3"><a href="Contact_Us.html">Contact Us</a></li>
            </ul>

    <div class="font-controls">

        <button id="About_Increase_button">A+</button>

        <button id="About_Reset_button">A</button>

        <button id="About_Decrease_button">A-</button>
    
    </div>

    <!--This created a theme selector-->
<div class="colour_theme_container">
    <label for="A_Colour_selector">Theme:</label>
    <select id="A_Colour_selector" class="Colour_selector">
        <option value="default">Default</option>
        <option value="dark">Dark</option>
        <option value="light">Light</option>
    </select>
    </div>

    <!--This created an icon for the basket-->
    <div class="basket_container">

        <button class="baskets" id="About_basket">
        <span class="basket_icon" >
        <img class="basket_icons"  id="About_basket_icon" src="Images/Icon/Basket.jpg">
        </span>
        <span class="basket_number" id="About_basket_number">0</span>
        </button>
    </div>

        </nav>
    </div>

    

</body>
</html>
